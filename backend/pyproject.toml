[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cryocore-backend"
version = "0.1.0"
description = "NISAR-first Earth observation API for Chattogram Division, Bangladesh"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "shapely>=2.1,<3",
  "h5py>=3.15,<4",
  "numpy>=2,<3",
  "rasterio>=1.4,<2",
  "pyproj>=3.7,<4",
  "scipy>=1.14,<2",
  "pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["assets/*.json", "assets/*.geojson"]
